# =============================================================================
# Hacker-Do CyberPulse — Docker Compose
#
#   cp .env.example .env    # fill in CYBERPULSE_SECRET and the first admin
#   docker compose up -d --build
#
# After the first start, remove CYBERPULSE_ADMIN_PASSWORD from .env.
# =============================================================================

services:
  cyberpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: hacker-do/cyberpulse:latest
    container_name: cyberpulse
    restart: unless-stopped
    ports:
      - "${CYBERPULSE_BIND:-127.0.0.1}:${CYBERPULSE_PORT:-3001}:3001"
    env_file: .env
    environment:
      - PORT=3001
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - cyberpulse_data:/app/data

volumes:
  cyberpulse_data:
